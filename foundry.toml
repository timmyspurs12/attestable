[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["EvidenceRegistry", "ProofPolicy"]

# Deploy.s.sol writes the deployed addresses here
fs_permissions = [
    {access = "read-write", path = "./config"},
    {access = "read-write", path = "./frontend/data"},
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[etherscan]
bsc_testnet = {key = "${ETHERSCAN_API_KEY}", chain = 97}
bsc = {key = "${ETHERSCAN_API_KEY}", chain = 56}

[rpc_endpoints]
bsc_testnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
bsc = "https://bsc-dataseed.bnbchain.org"
